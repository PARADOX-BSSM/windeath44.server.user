syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc";
option java_outer_classname = "Proto";

// login

service UserLoginService {
  rpc checkUser(UserLoginRequest) returns (UserLoginResponse);
}

message UserLoginRequest {
  string userId = 1;
  string password = 2;
}

message UserLoginResponse {
  bool existsUser = 1;
  string userKey = 2;
}

// email Validate to register

service UserRegisterService {
  rpc checkEmailValidation(UserRegisterRequest) returns (UserRegisterResponse);
}

message UserRegisterRequest {
  string email = 1;
}

message UserRegisterResponse {

}

// OAuth User Login

service OauthUserLoginService {
  rpc OauthUserRegister(OauthUserLoginRequest) returns (OauthUserLoginResponse);
}

message  OauthUserLoginRequest{
  string email = 1;
  string name = 2; // = name
}

message OauthUserLoginResponse {
  string userKey = 1;
}