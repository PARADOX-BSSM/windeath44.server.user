spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${JDBC_DRIVER_SOURCE}
    url: ${DB_URL}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect

grpc:
  server:
    address: ${GRPC_SERVER_ADDRESS}
    port: ${GRPC_SERVER_PORT}

  client:
    auth-server:
      address: ${GRPC_AUTH_SERVER_ADDRESS}
      negotiationType: "plaintext"
storage:
  bucket-name : ${STORAGE_BUCKET_NAME}
  namespace-name : ${STORAGE_NAMESPACE}
  configuration-file-path : ~/.oci/config
  profile : DEFAULT

server:
  port:
    ${SERVER_PORT}
